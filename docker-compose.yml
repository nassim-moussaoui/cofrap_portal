services:
  postgres:
    image: postgres:16
    container_name: cofrap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cofrap_db
      POSTGRES_USER: cofrap_user
      POSTGRES_PASSWORD: cofrap_password
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - cofrap_postgres_data:/var/lib/postgresql/data

volumes:
  cofrap_postgres_data:
