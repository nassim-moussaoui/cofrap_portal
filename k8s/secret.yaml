# Remplace les valeurs avant d'appliquer en production.
# Pour encoder en base64 : echo -n "valeur" | base64
apiVersion: v1
kind: Secret
metadata:
  name: cofrap-secrets
  namespace: cofrap
type: Opaque
stringData:
  FLASK_SECRET_KEY: "change-me-in-production"
  POSTGRES_PASSWORD: "cofrap_password"
  COFRAP_DB_PASSWORD: "cofrap_password"
